<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Healthcare Assistant</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(720px, 100%); background: white; border: 1px solid #dce3ed; border-radius: 18px; padding: 28px; box-shadow: 0 12px 35px rgba(24, 44, 76, .08); }
    h1 { margin: 0 0 8px; font-size: 1.65rem; }
    .intro { margin: 0 0 24px; color: #526078; }
    label { display: block; margin: 16px 0 7px; font-weight: 650; }
    select, textarea, input[type="file"], button { width: 100%; font: inherit; }
    select, textarea, input[type="file"] { border: 1px solid #cbd5e1; border-radius: 10px; padding: 11px; background: #fff; }
    textarea { min-height: 140px; resize: vertical; }
    button { margin-top: 18px; border: 0; border-radius: 10px; padding: 12px 16px; color: white; background: #1769aa; cursor: pointer; font-weight: 700; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 24px; margin-top: 18px; color: #526078; }
    #reply { white-space: pre-wrap; margin-top: 12px; padding: 16px; border-radius: 10px; background: #f1f5f9; line-height: 1.55; }
    .disclaimer { margin-top: 20px; color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Healthcare Assistant</h1>
    <p class="intro">Share general health questions or an image. This service does not replace a qualified medical professional.</p>

    <form id="chat-form">
      <label for="language">Language</label>
      <select id="language" name="lang">
        <option value="en">English</option>
        <option value="ha">Hausa</option>
        <option value="fr">Français</option>
        <option value="ar">العربية</option>
      </select>

      <label for="message">Symptoms or question</label>
      <textarea id="message" name="message" maxlength="2000" placeholder="Describe what you are experiencing..."></textarea>

      <label for="image">Optional image (JPG or PNG, max 5MB)</label>
      <input id="image" name="image" type="file" accept="image/jpeg,image/png">

      <button id="submit-button" type="submit">Send</button>
    </form>

    <div id="status" role="status" aria-live="polite"></div>
    <div id="reply" hidden></div>
    <p class="disclaimer">For emergencies, contact local emergency services immediately.</p>
  </main>

  <script>
    const form = document.getElementById("chat-form");
    const imageInput = document.getElementById("image");
    const submitButton = document.getElementById("submit-button");
    const status = document.getElementById("status");
    const reply = document.getElementById("reply");

    function readAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Could not read the image."));
        reader.readAsDataURL(file);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      status.textContent = "Sending...";
      reply.hidden = true;

      try {
        const image = imageInput.files[0] || null;
        if (image && image.size > 5 * 1024 * 1024) {
          throw new Error("Image too large. Maximum size is 5MB.");
        }

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: document.getElementById("message").value,
            lang: document.getElementById("language").value,
            image: await readAsDataUrl(image)
          })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.reply || "Request failed.");

        reply.textContent = result.reply || "No response received.";
        reply.hidden = false;
        status.textContent = result.is_emergency ? "Emergency guidance provided." : "";
      } catch (error) {
        status.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
